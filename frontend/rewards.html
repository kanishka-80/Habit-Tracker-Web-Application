<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rewards &amp; Badges — Habit</title>
    <meta name="description" content="Track your level, points, unlocked badges and consistency milestones." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation"></aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <div class="app-main">
        <div class="mobile-bar">
          <button class="btn btn-outline-gold btn-sm" type="button" id="sidebarTrigger" aria-label="Open menu">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <strong class="font-heading">Rewards</strong>
          <img src="images/logo.png" alt="Habit Logo" class="brand-logo-img" style="width: 36px; height: 36px; object-fit: contain;" />
        </div>

        <div class="page-wrap">
          <header class="welcome-panel fade-up">
            <div>
              <h1>Rewards</h1>
              <p class="welcome-meta" id="rewardSummary"></p>
              <p class="welcome-quote mb-0">Points come from completed study tasks, habits and streaks.</p>
            </div>
            <button class="btn btn-outline-gold" type="button" id="viewAchievement">
              <i class="fa-solid fa-medal me-1" aria-hidden="true"></i>Latest achievement
            </button>
          </header>

          <section class="card-panel section-gap">
            <div class="row g-4 align-items-center">
              <div class="col-12 col-md-4">
                <div class="stat-label">Current level</div>
                <div class="stat-value" id="rewardLevel">Level 1</div>
              </div>
              <div class="col-12 col-md-4">
                <div class="stat-label">Current points</div>
                <div class="stat-value" id="rewardPoints">0 pts</div>
              </div>
              <div class="col-12 col-md-4">
                <div class="stat-label">Next level</div>
                <div class="stat-value" id="rewardNext" style="font-size: 1rem"></div>
              </div>
              <div class="col-12">
                <div class="progress" role="progressbar" aria-label="Level progress">
                  <div class="progress-bar" id="rewardBar" style="width: 0%"></div>
                </div>
              </div>
            </div>
          </section>

          <section class="section-gap">
            <h2 class="section-title mb-3">Badges</h2>
            <div class="row g-4" id="badgeGrid"></div>
          </section>

          <section class="card-panel">
            <div class="card-head">
              <div>
                <h2 class="section-title">Milestones</h2>
                <p class="section-subtitle">Longer-term goals that unlock higher levels.</p>
              </div>
            </div>
            <div id="milestoneList"></div>
          </section>
        </div>
      </div>
    </div>

    <div class="modal fade" id="achievementModal" tabindex="-1" aria-labelledby="achievementTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-center">
          <div class="modal-header border-0">
            <h2 class="modal-title section-title" id="achievementTitle">Achievement unlocked</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <i class="fa-solid fa-fire text-gold" style="font-size: 2rem" aria-hidden="true"></i>
            <h3 class="section-title mt-3">7 Day Streak</h3>
            <p class="section-subtitle mb-0">You kept your habits alive for seven days in a row. Keep going.</p>
          </div>
          <div class="modal-footer border-0 justify-content-center">
            <button class="btn btn-gold" type="button" data-bs-dismiss="modal">Continue</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/api/api.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/api/habitApi.js"></script>
    <script src="js/api/studyApi.js"></script>
    <script src="js/api/journalApi.js"></script>
    <script src="js/api/rewardApi.js"></script>
    <script src="js/app.js"></script>
    <script src="js/reward.js"></script>
  </body>
</html>
