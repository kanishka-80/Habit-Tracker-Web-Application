<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar — Habit</title>
    <meta name="description" content="See study tasks, habits and reminders on a single responsive calendar." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/calendar.css" />
    <link rel="stylesheet" href="css/study.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation"></aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <div class="app-main">
        <div class="mobile-bar">
          <button class="btn btn-outline-gold btn-sm" type="button" id="sidebarTrigger" aria-label="Open menu">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <strong class="font-heading">Calendar</strong>
          <img src="images/logo.png" alt="Habit Logo" class="brand-logo-img" style="width: 36px; height: 36px; object-fit: contain;" />
        </div>

        <div class="page-wrap">
          <header class="welcome-panel fade-up">
            <div>
              <h1>Calendar</h1>
              <p class="welcome-quote mb-0">Study tasks, habit schedules and reminders in one view.</p>
            </div>
            <div class="calendar-filters">
              <button class="plan-tab active" type="button" data-filter="all">All</button>
              <button class="plan-tab" type="button" data-filter="Study">Study</button>
              <button class="plan-tab" type="button" data-filter="Habit">Habits</button>
              <button class="plan-tab" type="button" data-filter="Reminder">Reminders</button>
            </div>
          </header>

          <section class="calendar-shell">
            <div id="fullCalendar"></div>
            <div class="calendar-legend">
              <span class="type-study">Study task</span>
              <span class="type-habit">Habit</span>
              <span class="type-reminder">Reminder</span>
              <span class="type-done">Completed</span>
            </div>
          </section>
        </div>
      </div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title section-title" id="eventModalTitle">Event</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="eventModalBody"></div>
          <div class="modal-footer">
            <button class="btn btn-outline-gold" type="button" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/api/api.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/api/habitApi.js"></script>
    <script src="js/api/studyApi.js"></script>
    <script src="js/api/calendarApi.js"></script>
    <script src="js/app.js"></script>
    <script src="js/calendar.js"></script>
  </body>
</html>
