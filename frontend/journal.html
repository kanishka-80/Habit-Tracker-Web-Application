<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reflection Journal — Habit</title>
    <meta name="description" content="Write daily study reflections, record your mood and revisit previous entries." />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/sidebar.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/study.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="app-sidebar" id="appSidebar" aria-label="Main navigation"></aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

      <div class="app-main">
        <div class="mobile-bar">
          <button class="btn btn-outline-gold btn-sm" type="button" id="sidebarTrigger" aria-label="Open menu">
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <strong class="font-heading">Journal</strong>
          <img src="images/logo.png" alt="Habit Logo" class="brand-logo-img" style="width: 36px; height: 36px; object-fit: contain;" />
        </div>

        <div class="page-wrap">
          <header class="welcome-panel fade-up">
            <div>
              <h1>Reflection Journal</h1>
              <p class="welcome-quote mb-0">A short daily note keeps your study routine honest.</p>
            </div>
          </header>

          <section class="card-panel section-gap">
            <div class="card-head">
              <div>
                <h2 class="section-title">Today's Reflection</h2>
                <p class="section-subtitle">How did the study session and habits go?</p>
              </div>
            </div>
            <form id="journalForm" novalidate>
              <div class="row g-3">
                <div class="col-12 col-md-4">
                  <label class="form-label" for="editorDate">Date</label>
                  <input class="form-control" type="date" id="editorDate" />
                </div>
                <div class="col-12 col-md-8">
                  <span class="form-label d-block">Mood</span>
                  <div class="mood-picker" id="moodPicker" role="group" aria-label="Mood selector"></div>
                </div>
                <div class="col-12">
                  <label class="form-label" for="entryText">Notes</label>
                  <textarea class="form-control" id="entryText" rows="4" placeholder="What went well, what slipped, and what will change tomorrow?"></textarea>
                  <p class="field-error" id="entryTextError" role="alert">Write at least 10 characters.</p>
                </div>
              </div>
              <div class="d-flex flex-wrap gap-2 mt-3 stack-mobile">
                <button class="btn btn-gold" type="submit" id="saveEntryButton">Save Entry</button>
              </div>
            </form>
          </section>

          <section class="card-panel section-gap">
            <div class="row g-3 align-items-end">
              <div class="col-12 col-lg-6">
                <label class="form-label" for="entrySearch">Search entries</label>
                <input class="form-control" type="search" id="entrySearch" placeholder="Search by text or mood" />
              </div>
              <div class="col-8 col-lg-4">
                <label class="form-label" for="entryDate">Filter by date</label>
                <input class="form-control" type="date" id="entryDate" />
              </div>
              <div class="col-4 col-lg-2">
                <button class="btn btn-outline-gold w-100" type="button" id="clearFilters">Clear</button>
              </div>
            </div>
          </section>

          <section class="row g-4" id="entryGrid"></section>
        </div>
      </div>
    </div>

    <div class="modal fade" id="entryModal" tabindex="-1" aria-labelledby="entryModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title section-title" id="entryModalTitle">Entry</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="entryModalBody"></div>
          <div class="modal-footer">
            <button class="btn btn-outline-gold" type="button" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="deleteEntryModal" tabindex="-1" aria-labelledby="deleteEntryTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title section-title" id="deleteEntryTitle">Delete entry</h2>
            <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body"><p class="mb-0">This journal entry will be removed from demo storage.</p></div>
          <div class="modal-footer">
            <button class="btn btn-outline-gold" type="button" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-gold" type="button" id="confirmDeleteEntry">Delete</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/api/api.js"></script>
    <script src="js/api/authApi.js"></script>
    <script src="js/api/journalApi.js"></script>
    <script src="js/app.js"></script>
    <script src="js/journal.js"></script>
  </body>
</html>
